name: check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: format
        run: deno fmt --check

      - name: lint
        run: deno lint

      - name: type-check
        run: deno task check

      - name: test
        run: deno task test

      # The editor is a committed bundle, so the one way it can be wrong is by
      # drifting from src/editor.ts — which no test can see, because the bundle
      # is what runs. Rebuilding it here makes that a build failure.
      - name: editor bundle is current
        run: |
          deno task build:editor
          git diff --exit-code -- src/editor_bundle.js

      - name: build
        run: deno task build
