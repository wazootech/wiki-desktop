name: check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: format
        run: deno fmt --check

      - name: lint
        run: deno lint

      - name: type-check
        run: deno task check

      - name: test
        run: deno task test

      # The editor is a committed bundle, so the one way it can be wrong is by
      # drifting from src/editor.ts — which no test can see, because the bundle
      # is what runs. Rebuilding it here makes that a build failure.
      - name: editor bundle is current
        run: |
          deno task build:editor
          git diff --exit-code -- src/editor_bundle.js

      - name: build
        run: deno task build

  # The panel decides a field's validity itself, from the vault's own shapes,
  # rather than asking `wiki check` — because the CLI can only read a file that
  # is already on disk, and #8's first acceptance criterion is a verdict before
  # the save. That decision is only defensible while it agrees with the tool
  # that owns the truth, and `src/shacl_agreement_test.ts` is what checks it.
  #
  # It is a separate job because it needs two things the main job has no reason
  # to have: Python, and the `wiki` CLI itself. The test runs against
  # `testdata/shacl-vault/`, a committed fixture, so this needs no vault and no
  # secrets — a checkout is the whole input.
  agreement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Not pinned to a version on purpose. The test asserts that this app and
      # pyshacl say the same thing, so a release that changes the wording is
      # supposed to turn this job red — that is the drift it exists to catch,
      # and pinning would hide it until someone remembered to look.
      - name: install the wiki CLI
        run: |
          pip install wazootech-wiki
          # setup-python puts scripts on the PATH, but proving it here means a
          # broken install is reported as a broken install rather than as a
          # failing test three steps later.
          wiki --version

      - name: the app and `wiki check` agree
        # WIKI_AGREEMENT_REQUIRED turns "the CLI is missing" from a printed note
        # into a failure. Without it a broken install would skip the test and
        # this job would be green for having checked nothing.
        env:
          WIKI_AGREEMENT_REQUIRED: "1"
        # `deno test` rather than `deno task test:agreement`, because the task
        # hardcodes --allow-run=wiki and an appended flag arrives as a trailing
        # argument instead of a flag — it cannot be added to from outside.
        #
        # `--allow-run` with no value, which grants spawning any subprocess,
        # because the two narrow grants both fail here. `--allow-run=wiki` is
        # refused as NotCapable with the binary plainly on PATH, and so is the
        # path `command -v` prints; pip installs a console script that is a
        # symlink into site-packages, and Deno's check does not follow it. That
        # is a wide grant for a job that exists to run one test file against
        # one known binary, and it is scoped to this job rather than to
        # `deno task test`, which keeps the narrower grant for local use.
        run: >-
          deno test --allow-read --allow-write --allow-env --allow-run
          src/shacl_agreement_test.ts
